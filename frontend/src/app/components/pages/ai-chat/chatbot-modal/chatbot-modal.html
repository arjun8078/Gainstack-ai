<div class="flex flex-col h-full bg-[#1e293b]">

  <!-- Header -->
  <div class="flex items-center gap-3 px-4 py-3 bg-[#0f3d2e] border-b border-[#1d4d38] flex-shrink-0">
    <div class="w-9 h-9 bg-teal-500 rounded-lg flex items-center justify-center text-lg flex-shrink-0">
      🤖
    </div>
    <div>
      <p class="text-sm font-medium text-slate-100 m-0">AI Assistant</p>
      <div class="flex items-center gap-1">
        <div class="w-1.5 h-1.5 bg-teal-400 rounded-full"></div>
        <p class="text-xs text-teal-400 m-0">Online</p>
      </div>
    </div>
    <button
      class="ml-auto text-slate-500 hover:text-slate-300 text-lg bg-transparent border-none cursor-pointer"
      (click)="closeChat()">
      ✕
    </button>
  </div>

  <!-- Messages -->
  <div class="flex-1 overflow-y-auto p-3 space-y-2 min-h-0">

    @for(message of chatservice.messages(); track message.timestamp){

      @if(message.isUser){
        <div class="flex justify-end">
          <div class="bg-teal-500 text-white px-3 py-2 rounded-lg rounded-br-sm text-sm max-w-[75%]">
            {{message.text}}
          </div>
        </div>

      } @else {
        <div class="flex justify-start items-end gap-2">
          <div class="w-6 h-6 bg-[#0f3d2e] rounded-md flex items-center justify-center text-xs flex-shrink-0">
            🤖
          </div>
          <div class="bg-[#0f172a] text-slate-300 px-3 py-2 rounded-lg rounded-bl-sm text-sm max-w-[75%] border border-[#1e293b]"
               [class.text-red-400]="message.isError">
            {{message.text}}
          </div>
        </div>
      }

    }

    <!-- Loading -->
    @if(chatservice.isLoading()){
      <div class="flex justify-start items-center gap-2">
        <div class="w-6 h-6 bg-[#0f3d2e] rounded-md flex items-center justify-center text-xs flex-shrink-0">
          🤖
        </div>
        <div class="flex gap-1 px-3 py-2">
          <div class="w-1.5 h-1.5 bg-teal-400 rounded-full animate-bounce" style="animation-delay:0ms"></div>
          <div class="w-1.5 h-1.5 bg-teal-400 rounded-full animate-bounce" style="animation-delay:150ms"></div>
          <div class="w-1.5 h-1.5 bg-teal-400 rounded-full animate-bounce" style="animation-delay:300ms"></div>
        </div>
      </div>
    }

    <!-- Limit Reached -->
    @if(isLimitReached()){
      <div class="bg-[#0f172a] border border-teal-900 rounded-lg p-3 text-center">
        <p class="text-slate-400 text-xs mb-2">Quick chat limit reached!</p>
        <button
          (click)="openFullChat()"
          class="bg-teal-500 text-white px-3 py-1 rounded text-xs hover:bg-teal-600">
          Open Full Chat →
        </button>
      </div>
    }

  </div>

  <!-- Input -->
  <div class="px-3 py-2 border-t border-[#334155] bg-[#1e293b] flex-shrink-0">
    <div class="flex gap-2 items-center">
      <input
        type="text"
        placeholder="Type your message..."
        [value]="question()"
        (input)="question.set($event.target.value)"
        (keydown.enter)="sendMessage()"
        class="flex-1 bg-[#0f172a] border border-[#334155] rounded-lg px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-teal-500"
      />
      <button
        (click)="sendMessage()"
        class="bg-teal-500 hover:bg-teal-600 text-white w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0">
        ➤
      </button>
    </div>
    <div class="flex justify-between mt-2">
      <button
        (click)="ResetChat()"
        class="text-xs text-slate-500 hover:text-slate-300 bg-transparent border-none cursor-pointer">
        ↺ Reset chat
      </button>
      <button
        (click)="openFullChat()"
        class="text-xs text-teal-400 hover:text-teal-300 border border-[#334155] rounded px-2 py-0.5 bg-transparent cursor-pointer">
        Open full chat →
      </button>
    </div>
  </div>

</div>
