<div class="fixed top-0 left-0 right-0 flex justify-center pt-4 z-50">
  @for (toast of (toasts$ | async); track toast.id) {
    <div
      class="bg-white text-gray-900 px-6 py-4 rounded-lg shadow-xl mb-2 flex items-center gap-4 min-w-96"
      [class.bg-green-50]="toast.type === 'success'"
      [class.bg-red-50]="toast.type === 'error'"
      [class.bg-yellow-50]="toast.type === 'warning'"
    >

      @if (toast.type === 'success') {
        <span class="text-green-600 text-2xl">✓</span>
      } @else if (toast.type === 'error') {
        <span class="text-red-600 text-2xl">✗</span>
      } @else if (toast.type === 'warning') {
        <span class="text-yellow-600 text-2xl">⚠️</span>
      }

      <!-- Message -->
      <span class="flex-1 text-sm font-medium">{{ toast.message }}</span>

      <!-- Close Button -->
      <button
        (click)="removeToast(toast.id)"
        class="ml-4 text-gray-500 hover:text-gray-700 font-bold transition-colors"
      >
        ✕
      </button>
    </div>
  }
</div>
